name: "bun install (shared cache)"
description: >
   Ensure the root packageManager-pinned bun version is on PATH, run
   `bun install --frozen-lockfile` with the actions/cache-backed package store,
   then materialize the gitignored source codegen so the tree is runnable.
   A missing or mismatched runner bun is installed in a job-local directory.

inputs:
   shell:
      description: Shell used to run this action's command steps
      required: false
      default: bash
runs:
   using: composite
   steps:
      - name: Detect bun
        id: env
        shell: ${{ inputs.shell }}
        run: |
           # Read the only bun version pin from the root package manifest.
           version="$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"bun@\([^"]*\)".*/\1/p' package.json | head -n1)"
           if [ -z "$version" ]; then
             echo "::error title=bun pin missing::package.json declares no \"packageManager\": \"bun@<version>\"" >&2
             exit 1
           fi
           pin="bun-v${version}"
           echo "BUN_INSTALL_CACHE_DIR=${HOME}/.bun/install/cache" >> "$GITHUB_ENV"
           installed=""
           if command -v bun >/dev/null 2>&1; then
             installed="$(bun --version)"
           fi
           if [ "$installed" = "$version" ]; then
             echo "setup_bun=false" >> "$GITHUB_OUTPUT"
             echo "bun present at pinned version: $installed"
           else
             bun_install="${RUNNER_TEMP}/bun-${pin}"
             echo "setup_bun=true" >> "$GITHUB_OUTPUT"
             echo "BUN_INSTALL=${bun_install}" >> "$GITHUB_ENV"
             if [ "${RUNNER_OS:-}" = "Windows" ]; then
               cygpath -w "${bun_install}/bin" >> "$GITHUB_PATH"
             else
               echo "${bun_install}/bin" >> "$GITHUB_PATH"
             fi
             echo "bun ${installed:-missing}; installing pinned ${version} in job-local storage"
           fi
      - name: Install bun when absent or mismatched
        if: steps.env.outputs.setup_bun == 'true'
        shell: ${{ inputs.shell }}
        run: |
           # The version and install directory are selected by the detection
           # step from the root packageManager pin and RUNNER_TEMP.
           version="$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"bun@\([^"]*\)".*/\1/p' package.json | head -n1)"
           if [ -z "$version" ]; then
             echo "::error title=bun pin missing::package.json declares no \"packageManager\": \"bun@<version>\"" >&2
             exit 1
           fi
           pin="bun-v${version}"
           if [ -z "${BUN_INSTALL:-}" ]; then
             echo "::error title=bun install directory missing::the detection step did not provide BUN_INSTALL" >&2
             exit 1
           fi
           attempt=1
           while ! curl -fsSL https://bun.sh/install | bash -s "${pin}"; do
             if [ "$attempt" -ge 3 ]; then
               echo "::error title=bun setup failed::failed to install ${pin} after $attempt attempts" >&2
               exit 1
             fi
             echo "::warning title=bun setup retry::${pin} install failed on attempt $attempt; retrying" >&2
             sleep "$attempt"
             attempt=$((attempt + 1))
           done
           if [ "${RUNNER_OS:-}" = "Windows" ]; then
             cygpath -w "${BUN_INSTALL}/bin" >> "$GITHUB_PATH"
           else
             echo "${BUN_INSTALL}/bin" >> "$GITHUB_PATH"
           fi

      - name: Cache bun store
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
           path: ~/.bun/install/cache
           # The workspace lockfile, by exact path. A `**/bun.lock` glob also walks
           # `tests/evals/datasets/repo-cache/`, where a checked-out fixture
           # repository carries its own lockfile that appears and disappears while a
           # job runs; the save phase of a native build then fails the whole job with
           # "hashFiles('**/bun.lock') failed. Fail to hash files under directory".
           key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
           restore-keys: |
             bun-${{ runner.os }}-

      - name: Bun cache diagnostic
        shell: ${{ inputs.shell }}
        env:
           CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
           RUNNER_NAME: ${{ runner.name }}
        run: |
           # 1. Effective cache and environment inspection
           effective_cache="$(bun pm cache 2>/dev/null || true)"
           echo "bun pm cache: ${effective_cache:-<failed to query>}"
           echo "BUN_INSTALL=${BUN_INSTALL:-<unset>}"
           echo "BUN_INSTALL_CACHE_DIR=${BUN_INSTALL_CACHE_DIR:-<unset>}"
           echo "HOME=${HOME:-<unset>}"
           echo "RUNNER_NAME=${RUNNER_NAME:-<unset>}"
           echo "cache-hit: ${CACHE_HIT:-false}"
           expected_cache="${HOME}/.bun/install/cache"
           echo "expected cached path: ${expected_cache} (~/.bun/install/cache)"

           echo "::notice title=Bun cache diagnostic::effective_cache=${effective_cache:-unknown}, expected_cache=~/.bun/install/cache, cache_hit=${CACHE_HIT:-false}, runner=${RUNNER_NAME:-unknown}, BUN_INSTALL=${BUN_INSTALL:-unset}"

           # 2. Read only the allowed [install.cache] scalar settings.
           for cfg in "bunfig.toml" "${HOME}/.bunfig.toml"; do
             echo "--- Checking bunfig: ${cfg} ---"
             if [ ! -f "${cfg}" ]; then
               echo "${cfg}: missing"
               echo "::notice title=Bunfig install.cache config::${cfg}: missing"
               continue
             fi
             if ! parsed="$(BUNFIG_PATH="$cfg" bun -e '
               const fs = require("node:fs");
               try {
                 const config = Bun.TOML.parse(fs.readFileSync(process.env.BUNFIG_PATH, "utf8"));
                 const cache = config.install?.cache;
                 const selected = {};
                 if (typeof cache?.dir === "string") selected.dir = cache.dir;
                 if (typeof cache?.disable === "boolean") selected.disable = cache.disable;
                 if (typeof cache?.disableManifest === "boolean") selected.disableManifest = cache.disableManifest;
                 console.log(JSON.stringify(selected));
               } catch {
                 process.exitCode = 1;
               }
             ' 2>/dev/null)"; then
               echo "${cfg}: unreadable or invalid"
               echo "::notice title=Bunfig install.cache config::${cfg}: unreadable or invalid"
               continue
             fi
             echo "Allowed [install.cache] settings: ${parsed}"
             echo "::notice title=Bunfig install.cache config::${cfg}: ${parsed}"
           done

           # 3. Read-only Linux load evidence
           echo "=== Linux load evidence ==="
           if [ -f /proc/loadavg ]; then
             load_uptime="$(uptime 2>/dev/null || true)"
             load_avg="$(cat /proc/loadavg 2>/dev/null || true)"
             cpu_count="$(nproc 2>/dev/null || true)"
             mem_avail="$(grep -E '^(MemTotal|MemAvailable|MemFree):' /proc/meminfo 2>/dev/null | tr '\n' ' ' | sed -e 's/[[:space:]]*$//' || true)"
             if [ -z "$mem_avail" ]; then
               mem_avail="$(free -m 2>/dev/null | awk '/^Mem:/{print "MemAvailable: "$7" MiB"}' || true)"
             fi
             echo "uptime: ${load_uptime}"
             echo "/proc/loadavg: ${load_avg}"
             echo "nproc: ${cpu_count}"
             echo "memory: ${mem_avail}"
             echo "::notice title=Linux load diagnostic::uptime=${load_uptime}, loadavg=${load_avg}, nproc=${cpu_count}, ${mem_avail}"
           else
             echo "/proc/loadavg not available; skipping Linux load diagnostics"
           fi

      - name: Install dependencies
        shell: ${{ inputs.shell }}
        run: |
           start_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date 2>/dev/null || true)"
           install_completed=false
           on_signal() {
             status=$1
             elapsed=$SECONDS
             echo "::notice title=Bun install timing::status=timeout/terminated (${status}) elapsed=${elapsed}s (start=${start_date})"
             trap - HUP INT TERM EXIT
             exit "$status"
           }
           trap 'on_signal 129' HUP
           trap 'on_signal 130' INT
           trap 'on_signal 143' TERM
           on_exit() {
             status=$?
             elapsed=$SECONDS
             trap - HUP INT TERM EXIT
             if [ "$install_completed" != "true" ] && [ "$status" -eq 0 ]; then
               status=143
             fi
             if [ "$status" -eq 124 ] || [ "$status" -eq 129 ] || [ "$status" -eq 130 ] || [ "$status" -eq 143 ]; then
               echo "::notice title=Bun install timing::status=timeout/terminated (${status}) elapsed=${elapsed}s (start=${start_date})"
             else
               echo "::notice title=Bun install timing::status=${status} elapsed=${elapsed}s (start=${start_date})"
             fi
             exit "$status"
           }
           trap on_exit EXIT
           SECONDS=0

           # The shared bun store (actions/cache) can hand a job a corrupt or
           # partially written tarball when parallel jobs touch the same cache
           # entry, so `bun install` aborts with `Fail extracting tarball for
           # "<pkg>"`. That blob is content-hash-named, not derivable from the
           # package name, so we can't evict just the bad entry — instead retry
           # the install against a fresh job-local cache dir, forcing a clean
           # re-download without mutating the shared store other concurrent jobs
           # rely on. The warm shared cache stays the fast path; the cold retry
           # only runs on the rare corruption (also covers a transient network
           # blip on attempt 1).
           if bun install --frozen-lockfile; then
             install_completed=true
             exit 0
           fi
           echo "::warning title=bun install retry::shared bun store install failed; retrying with a clean job-local cache"
           retry_cache="$(mktemp -d "${RUNNER_TEMP:-/tmp}/bun-cache-retry.XXXXXX")"
           bun install --frozen-lockfile --cache-dir="$retry_cache"
           install_completed=true

      - name: Generate source codegen
        shell: ${{ inputs.shell }}
        run: |
           start_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date 2>/dev/null || true)"
           trap 'status=$?; elapsed=$SECONDS; echo "::notice title=Source codegen timing::status=${status} elapsed=${elapsed}s (start=${start_date})"' EXIT
           SECONDS=0

           # coding-agent's src/export/html/index.ts imports
           # ./tool-views.generated.js (a gitignored codegen artifact bundled
           # from collab-web/src/tool-render). `bun install` alone does not
           # produce it — bun skips the root `prepare` on a no-op frozen install
           # — so every source-running job (`ci:test:smoke`, the coding-agent
           # test matrix) died with "Cannot find module './tool-views.generated.js'".
           # Materialize it here, in the one shared setup step, so the tree is
           # runnable from source. Fast (~30ms) and deterministic; fail loud if
           # codegen breaks rather than shipping a stale/missing bundle.
           bun --cwd=packages/coding-agent run gen:tool-views
