name: TS test environment
description: >-
   Give a TypeScript test bucket the two things it needs before its first
   assertion: the Linux x64 native addon (this run's build, or the cached
   artifact the lookup found) and the built test sandbox image.

inputs:
   native-result:
      description: >-
         `needs.native_linux_x64.result`. On success the addon comes from this
         run; on any other result it comes from the run the lookup named.
      required: true
   lookup-run-id:
      description: >-
         `needs.native_artifact_lookup.outputs.linux-x64-run-id`, the cached
         artifact's run, used when this run did not build one.
      required: true
   source-hash:
      description: >-
         `needs.native_artifact_lookup.outputs.source-hash`. The artifact name
         carries it, so a stale addon can never be downloaded for new sources.
      required: true
   github-token:
      description: Token used to read the artifact, which may belong to another run.
      required: true
   sandbox:
      description: >-
         Build the test sandbox image. "false" for a bucket that runs no
         `bun test` and would otherwise pay for an image it never enters.
      default: "true"

runs:
   using: composite
   steps:
      - name: Resolve Linux x64 native artifact run
        id: source
        shell: bash
        run: |
           if [ "${{ inputs.native-result }}" = "success" ]; then
             echo "artifact-run-id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
           else
             echo "artifact-run-id=${{ inputs.lookup-run-id }}" >> "$GITHUB_OUTPUT"
           fi

      - name: Download native addons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
           pattern: veyyon-natives-linux-x64-*-h${{ inputs.source-hash }}
           path: natives/bridge/bindings/native
           merge-multiple: true
           run-id: ${{ steps.source.outputs.artifact-run-id }}
           github-token: ${{ inputs.github-token }}

      - name: Provide the test sandbox image
        if: ${{ inputs.sandbox == 'true' }}
        uses: ./.github/actions/test-sandbox-image
