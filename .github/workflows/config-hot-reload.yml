name: Config hot reload
on:
  pull_request:
    branches: [feat/native-topic-replenishment]
    paths:
      - packages/coding-agent/src/config/settings.ts
      - packages/coding-agent/src/config/settings-domains/subagents.ts
      - packages/coding-agent/bench/config-hot-reload.bench.ts
      - proof/scenes/config-hot-reload.sh
      - packages/coding-agent/src/slash-commands/**
      - packages/coding-agent/test/config-hot-reload.test.ts
      - .github/workflows/config-hot-reload.yml
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-system-deps
      - uses: ./.github/actions/bun-install
      - name: Build test sandbox
        run: bash scripts/test-sandbox/run.sh --build
      - name: Focused settings contracts
        run: bash scripts/test-sandbox/run.sh bun test packages/coding-agent/test/config-hot-reload.test.ts packages/coding-agent/test/settings-reload-cwd.test.ts
      - name: Exact-parity routing bench
        run: bash scripts/test-sandbox/run.sh bun packages/coding-agent/bench/config-hot-reload.bench.ts
      - name: Build private-display recorder
        run: |
          bun --cwd=packages/natives run ensure
          bash proof/docker/build-recorder.sh
      - name: Record production command differential
        run: bash proof/record.sh proof/scenes/config-hot-reload.sh
      - name: Preserve rendered command proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: config-hot-reload-proof
          path: proof/captures/x11/
          if-no-files-found: error
