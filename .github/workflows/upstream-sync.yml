name: Upstream Sync Check

on:
  schedule:
    # Run weekly on Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to comment on if PR creation is blocked (optional)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-and-open-sync-pr:
    name: Check upstream drift and open draft sync PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check upstream divergence and open draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: "https://github.com/santhreal/veyyon.git"
          UPSTREAM_BRANCH: "main"
          TARGET_BRANCH: "main"
          SYNC_ISSUE_INPUT: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          # Add upstream remote and fetch
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

          # Compute merge-base and commit counts
          UPSTREAM_HEAD=$(git rev-parse upstream/"$UPSTREAM_BRANCH")
          FORK_HEAD=$(git rev-parse origin/"$TARGET_BRANCH")
          MERGE_BASE=$(git merge-base "$FORK_HEAD" "$UPSTREAM_HEAD")

          BEHIND_COUNT=$(git rev-list --count "$FORK_HEAD..$UPSTREAM_HEAD")
          AHEAD_COUNT=$(git rev-list --count "$UPSTREAM_HEAD..$FORK_HEAD")

          echo "Fork head: $FORK_HEAD"
          echo "Upstream head: $UPSTREAM_HEAD"
          echo "Merge base: $MERGE_BASE"
          echo "Behind upstream by: $BEHIND_COUNT commits"
          echo "Ahead of upstream by: $AHEAD_COUNT commits"

          if [ "$BEHIND_COUNT" -eq 0 ]; then
            echo "Fork is up to date with upstream ($BEHIND_COUNT commits behind). Nothing to do."
            exit 0
          fi

          # Check if an upstream sync PR is already open
          EXISTING_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$TARGET_BRANCH" --state open --json number,title,headRefName \
            --jq '[.[] | select(.headRefName | startswith("sync/upstream-")) | .number] | first // ""')

          if [ -n "$EXISTING_PR" ]; then
            echo "An upstream sync PR is already open (#$EXISTING_PR). Skipping duplicate PR creation."
            exit 0
          fi

          DATE_STAMP=$(date -u +'%Y-%m-%d')
          SYNC_BRANCH="sync/upstream-${DATE_STAMP}"

          echo "Creating draft sync PR for branch $SYNC_BRANCH with $BEHIND_COUNT commits behind..."

          # Create sync branch from upstream head
          git checkout -b "$SYNC_BRANCH" upstream/"$UPSTREAM_BRANCH"
          git push origin "$SYNC_BRANCH"

          PR_TITLE="chore(sync): sync upstream changes (${BEHIND_COUNT} commits behind)"
          PR_BODY=$(printf '%s\n' \
            "## Upstream Drift Summary" \
            "- **Upstream HEAD**: \`$UPSTREAM_HEAD\`" \
            "- **Fork HEAD**: \`$FORK_HEAD\`" \
            "- **Merge Base**: \`$MERGE_BASE\`" \
            "- **Commits Behind Upstream**: $BEHIND_COUNT" \
            "- **Fork-Only Commits Ahead**: $AHEAD_COUNT" \
            "" \
            "## Instructions" \
            "This is an automated **DRAFT** pull request created by the Upstream Sync workflow." \
            "It never merges automatically and never force-pushes." \
            "Review conflicts, run targeted package gates, and merge via \`--no-ff\` merge commit when verified.")

          CREATE_OUTPUT=""
          CREATE_STATUS=0
          CREATE_OUTPUT=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --base "$TARGET_BRANCH" \
            --head "$SYNC_BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" 2>&1) || CREATE_STATUS=$?

          if [ "$CREATE_STATUS" -eq 0 ]; then
            echo "Draft PR opened successfully: $CREATE_OUTPUT"
            exit 0
          fi

          echo "gh pr create failed with exit code $CREATE_STATUS:"
          echo "$CREATE_OUTPUT"

          if [[ "$CREATE_OUTPUT" == *"not permitted to create or approve pull requests"* || "$CREATE_OUTPUT" == *"GitHub Actions is not permitted"* ]]; then
            echo "::warning::GitHub Actions is not permitted to create pull requests in this repository."
            echo "Degrading honestly: opening or refreshing tracking issue comment with branch link and operator instructions."

            # Determine tracking issue to comment on
            TRACKING_ISSUE="${SYNC_ISSUE_INPUT:-}"
            if [ -z "$TRACKING_ISSUE" ]; then
              TRACKING_ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 20 --json number,title \
                --jq '[.[] | select(.title | test("upstream sync|fork synchronization"; "i")) | .number] | first // ""')
            fi

            # Probe the real repository setting instead of asserting a value.
            # GH_TOKEN is the job's GITHUB_TOKEN, which may not be allowed to read this endpoint.
            PERM_STATUS=0
            PERM_OUTPUT=$(gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" 2>&1) || PERM_STATUS=$?

            if [ "$PERM_STATUS" -eq 0 ]; then
              PERM_APPROVE=$(printf '%s' "$PERM_OUTPUT" | jq -r '.can_approve_pull_request_reviews | tostring' 2>/dev/null || echo "unknown")
              PERM_DEFAULT=$(printf '%s' "$PERM_OUTPUT" | jq -r '.default_workflow_permissions // "unknown"' 2>/dev/null || echo "unknown")
              echo "Observed repos/$GITHUB_REPOSITORY/actions/permissions/workflow:"
              echo "  can_approve_pull_request_reviews: $PERM_APPROVE"
              echo "  default_workflow_permissions: $PERM_DEFAULT"
              PERM_REPORT=$(printf '%s\n' \
                "\`gh api repos/${GITHUB_REPOSITORY}/actions/permissions/workflow\` observed:" \
                "" \
                "- \`can_approve_pull_request_reviews\`: \`${PERM_APPROVE}\`" \
                "- \`default_workflow_permissions\`: \`${PERM_DEFAULT}\`")
            elif [[ "$PERM_OUTPUT" == *"HTTP 403"* || "$PERM_OUTPUT" == *"Resource not accessible"* ]]; then
              echo "::warning::This workflow's GITHUB_TOKEN cannot read repos/$GITHUB_REPOSITORY/actions/permissions/workflow (HTTP 403), so the current setting was not observed."
              echo "An operator must enable: Settings -> Actions -> General -> Workflow permissions -> 'Allow GitHub Actions to create and approve pull requests'."
              PERM_REPORT=$(printf '%s\n' \
                "\`gh api repos/${GITHUB_REPOSITORY}/actions/permissions/workflow\` returned **HTTP 403**: this workflow's \`GITHUB_TOKEN\` cannot read the repository Actions permission setting, so \`can_approve_pull_request_reviews\` and \`default_workflow_permissions\` were not observed." \
                "" \
                "An operator must enable **Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests** (the steps below).")
            else
              echo "::warning::Reading repos/$GITHUB_REPOSITORY/actions/permissions/workflow failed with exit status $PERM_STATUS; the current setting was not observed."
              echo "$PERM_OUTPUT"
              PERM_REPORT=$(printf '%s\n' \
                "\`gh api repos/${GITHUB_REPOSITORY}/actions/permissions/workflow\` failed with exit status ${PERM_STATUS}, so \`can_approve_pull_request_reviews\` and \`default_workflow_permissions\` were not observed:" \
                "\`\`\`" \
                "${PERM_OUTPUT}" \
                "\`\`\`")
            fi

            COMMENT_BODY=$(printf '%s\n' \
              "<!-- upstream-sync-comment -->" \
              "## ⚠️ Upstream Sync: Automated PR Creation Blocked by Repository Settings" \
              "" \
              "The upstream synchronization check detected **${BEHIND_COUNT} commits behind** upstream (\`${UPSTREAM_REPO}\` on \`${UPSTREAM_BRANCH}\`)." \
              "The candidate sync branch has been pushed to the fork:" \
              "- **Branch**: [\`${SYNC_BRANCH}\`](https://github.com/${GITHUB_REPOSITORY}/tree/${SYNC_BRANCH})" \
              "- **One-click PR creation URL**: [Create Draft PR on GitHub](https://github.com/${GITHUB_REPOSITORY}/pull/new/${SYNC_BRANCH})" \
              "" \
              "### Upstream Drift Summary" \
              "- **Upstream HEAD**: \`${UPSTREAM_HEAD}\`" \
              "- **Fork HEAD**: \`${FORK_HEAD}\`" \
              "- **Merge Base**: \`${MERGE_BASE}\`" \
              "- **Commits Behind Upstream**: ${BEHIND_COUNT}" \
              "- **Fork-Only Commits Ahead**: ${AHEAD_COUNT}" \
              "" \
              "### Root Cause & Operator Action Required" \
              "Draft PR creation via \`gh pr create\` failed with:" \
              "\`\`\`" \
              "${CREATE_OUTPUT}" \
              "\`\`\`" \
              "" \
              "The \`gh pr create\` denial above is the observed evidence that GitHub Actions is not permitted to create pull requests in this repository." \
              "${PERM_REPORT}" \
              "" \
              "**To allow GitHub Actions to automatically open draft sync pull requests, an operator must perform the following step:**" \
              "1. Navigate to repository **Settings** → **Actions** → **General**" \
              "2. Scroll down to **Workflow permissions**" \
              "3. Check the box: **Allow GitHub Actions to create and approve pull requests**" \
              "4. Click **Save**" \
              "" \
              "Until this repository setting is enabled, upstream sync will continue to push candidate branches and update this comment, but draft PRs must be opened manually using the link above.")

            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '%s\n' "$COMMENT_BODY" >> "$GITHUB_STEP_SUMMARY"
            fi

            if [ -n "$TRACKING_ISSUE" ]; then
              echo "Checking for existing sync comment on issue #$TRACKING_ISSUE..."
              EXISTING_COMMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$TRACKING_ISSUE/comments" \
                --jq '[.[] | select(.body | contains("<!-- upstream-sync-comment -->")) | .id] | last // ""')

              if [ -n "$EXISTING_COMMENT_ID" ]; then
                echo "Refreshing existing comment #$EXISTING_COMMENT_ID on issue #$TRACKING_ISSUE..."
                gh api "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING_COMMENT_ID" -X PATCH -f body="$COMMENT_BODY" > /dev/null
                echo "Issue comment refreshed successfully on #$TRACKING_ISSUE."
              else
                echo "Posting new comment on issue #$TRACKING_ISSUE..."
                gh api "repos/$GITHUB_REPOSITORY/issues/$TRACKING_ISSUE/comments" -X POST -f body="$COMMENT_BODY" > /dev/null
                echo "Issue comment posted successfully on #$TRACKING_ISSUE."
              fi
            else
              echo "No open tracking issue found. Creating an issue for upstream drift..."
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "chore(sync): upstream drift detected (${BEHIND_COUNT} commits behind) — PR creation blocked" \
                --body "$COMMENT_BODY" \
                --label "area:sync"
            fi

            echo "Workflow degraded honestly: candidate branch pushed, issue comment updated, operator step documented."
            exit 0
          fi

          echo "::error::gh pr create failed with unexpected error."
          exit "$CREATE_STATUS"
