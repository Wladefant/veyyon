name: Fleet adapter contracts

on:
  push:
    branches-ignore: [main]
    paths:
      - 'packages/coding-agent/examples/extensions/mainplane-*.ts'
      - 'packages/coding-agent/test/mainplane-*.test.ts'
      - 'scripts/fleet/**'
      - '.github/workflows/fleet-adapter-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-adapter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-contracts:
    runs-on: [self-hosted, Linux, X64, veyyon]
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p fleet-ci-evidence
          git rev-parse HEAD > fleet-ci-evidence/head.txt
      - name: Install the existing pinned Bun workspace
        uses: ./.github/actions/bun-install
      - name: Test receipt validation
        run: python3 -m unittest discover -s scripts/fleet -p 'test_*.py'
      - name: Run focused adapter contracts
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s bun test \
            packages/coding-agent/test/mainplane-go-worker-extension.test.ts \
            packages/coding-agent/test/mainplane-go-worker-read-text.test.ts \
            packages/coding-agent/test/mainplane-go-tool-failure.test.ts \
            packages/coding-agent/test/mainplane-go-worker-write.test.ts \
            --timeout 15000 --reporter=junit --reporter-outfile=fleet-ci-evidence/tests.xml \
            2>&1 | tee fleet-ci-evidence/tests.log
      - name: Record executed test receipt
        if: always()
        run: >-
          python3 scripts/fleet/junit_receipt.py
          --input fleet-ci-evidence/tests.xml --head-sha "$GITHUB_SHA"
          --output fleet-ci-evidence/receipt.json
      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fleet-adapter-${{ github.sha }}
          path: fleet-ci-evidence/
          if-no-files-found: error
          retention-days: 7
