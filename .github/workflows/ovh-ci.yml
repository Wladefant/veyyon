name: OVH CI

on:
  pull_request:
  push:
    branches: ['ovh-ci/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ovh-ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, veyyon]
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Record checkout identity
        run: |
          echo "checked-out SHA: $(git rev-parse HEAD)"
          echo "runner.name: ${RUNNER_NAME}"
      - name: Detect changed paths
        id: changed
        shell: bash
        env:
          RECEIPT: ${{ runner.temp }}/ovh-receipt.txt
          RELATED_TESTS: ${{ runner.temp }}/ovh-related-tests
          TOUCHED_PACKAGES: ${{ runner.temp }}/ovh-touched-packages
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          echo "RELATED_TESTS=$RUNNER_TEMP/ovh-related-tests" >> "$GITHUB_ENV"
          echo "RECEIPT=$RUNNER_TEMP/ovh-receipt.txt" >> "$GITHUB_ENV"
          echo "TOUCHED_PACKAGES=$RUNNER_TEMP/ovh-touched-packages" >> "$GITHUB_ENV"
          git diff --name-only -z "$base" HEAD | BASE="$base" node -e "let s='';process.stdin.setEncoding('utf8');process.stdin.on('data',x=>s+=x);process.stdin.on('end',()=>{const paths=s.split('\\0').filter(Boolean);const code=paths.length>0;require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'has_code='+code+'\\n');require('fs').writeFileSync(process.env.RECEIPT,'sha='+require('child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()+'\\nrunner.name='+process.env.RUNNER_NAME+'\\nmerge-base='+process.env.BASE+'\\nchanged-paths='+paths.length+'\\nselected-tests=0\\npass=0\\nfail=0\\nran=0\\n');if(!code){require('fs').writeFileSync(process.env.RELATED_TESTS,'');console.log('no-related-tests: 0 selected, 0 passed, 0 failed')}})"
      - name: Install dependencies and generate code
        id: install
        if: steps.changed.outputs.has_code == 'true'
        uses: ./.github/actions/bun-install
      - name: Resolve related test graph
        id: selection
        if: steps.changed.outputs.has_code == 'true' && steps.install.outcome == 'success'
        shell: bash
        env:
          RELATED_TESTS: ${{ runner.temp }}/ovh-related-tests
          TOUCHED_PACKAGES: ${{ runner.temp }}/ovh-touched-packages
          RECEIPT: ${{ runner.temp }}/ovh-receipt.txt
        run: |
          set -euo pipefail
          node scripts/ovh-related-tests.mjs --base origin/main --head HEAD
      - name: Prepare bwrap runtime
        id: bwrap
        if: steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p .ovh-tools/bin /var/tmp
          cp -L "$(bun -p 'process.execPath')" .ovh-tools/bin/bun
          alias_root="$(mktemp -d /var/tmp/veyyon-ovh-XXXXXX)"
          ln -s "$GITHUB_WORKSPACE" "$alias_root/repo"
          echo "VEYYON_SANDBOX_REPO_ROOT=$alias_root/repo" >> "$GITHUB_ENV"
          echo 'VEYYON_SANDBOX_REMOTE=0' >> "$GITHUB_ENV"
          echo 'VEYYON_SANDBOX_RUNG=bwrap' >> "$GITHUB_ENV"
          echo 'VEYYON_SANDBOX_TIMEOUT=1800' >> "$GITHUB_ENV"
      - name: Build native addon when required
        if: ${{ !cancelled() && steps.selection.outputs.rust_changed == 'true' }}
        env:
          CARGO_BUILD_JOBS: "2"
        run: bun run ci:build:native
      - name: Biome changed TypeScript and JavaScript
        id: biome
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mapfile -d '' files < <(git diff --diff-filter=ACMRT --name-only -z "$(git merge-base origin/main HEAD)" HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mts' '*.cts' '*.mjs' '*.cjs')
          if ((${#files[@]})); then bunx biome check --no-errors-on-unmatched -- "${files[@]}"; else echo 'No changed TS/JS files for Biome.'; fi
      - name: TypeScript check
        id: types
        if: ${{ !cancelled() && steps.selection.outputs.ts_changed == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r package; do
            [[ -n "$package" ]] || continue
            bun run --filter "$package" check:types
          done < "$RUNNER_TEMP/ovh-touched-packages"
      - name: Run selected tests serially
        if: ${{ !cancelled() && steps.selection.outcome == 'success' && steps.bwrap.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -s "$RUNNER_TEMP/ovh-related-tests" ]]; then
            echo 'no-related-tests: 0 selected, 0 passed, 0 failed'
            exit 0
          fi
          status=0; total_pass=0; total_fail=0; total_ran=0
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            log="$RUNNER_TEMP/ovh-test-$(printf '%s' "$file" | sha256sum | cut -c1-16).log"
            sandbox_root="$(bash scripts/test-sandbox/run.sh --rung=bwrap /bin/pwd)"
            runtime_bin="$sandbox_root/.ovh-tools/bin"
            if timeout 1800 bash scripts/test-sandbox/run.sh --rung=bwrap /bin/sh -c 'export PATH="$1:$PATH"; shift; exec "$@"' _ "$runtime_bin" "$runtime_bin/bun" test --preload "$sandbox_root/packages/utils/test/helpers/real-data-tripwire.ts" --preload "$sandbox_root/packages/ai/test/helpers/provider-override-tripwire.ts" "$file" 2>&1 | tee "$log"; then rc=0; else rc=${PIPESTATUS[0]}; status=1; fi
            summary="$(grep -E '^[[:space:]]*[0-9]+ (pass|fail)([,[:space:]]|$)|Ran [0-9]+' "$log" || true)"; printf '%s\n' "$summary"
            pass="$(printf '%s\n' "$summary" | sed -nE 's/^[[:space:]]*([0-9]+) pass.*/\1/p' | awk '{s+=$1} END{print s+0}')"
            fail="$(printf '%s\n' "$summary" | sed -nE 's/^[[:space:]]*([0-9]+) fail.*/\1/p' | awk '{s+=$1} END{print s+0}')"
            ran="$(printf '%s\n' "$summary" | sed -nE 's/^[[:space:]]*Ran ([0-9]+).*/\1/p' | awk '{s+=$1} END{print s+0}')"
            total_pass=$((total_pass+pass)); total_fail=$((total_fail+fail)); total_ran=$((total_ran+ran))
            if ((rc!=0||ran==0||fail!=0)); then echo "::error::Test failed or ran zero cases: $file exit=$rc ran=$ran fail=$fail"; status=1; fi
          done < "$RUNNER_TEMP/ovh-related-tests"
          echo "OVH_TEST_TOTAL pass=$total_pass fail=$total_fail ran=$total_ran"
          sed -i "s/^pass=.*/pass=$total_pass/;s/^fail=.*/fail=$total_fail/;s/^ran=.*/ran=$total_ran/" "$RECEIPT"
          ((total_ran>0)) || { echo '::error::No selected tests ran'; status=1; }
          exit "$status"
      - name: Upload test logs and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ovh-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ovh-test-*.log
            ${{ runner.temp }}/ovh-receipt.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Fail if static checks failed
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.biome.outcome }}" == failure || "${{ steps.types.outcome }}" == failure ]]; then
            echo '::error::Biome or TypeScript check failed.'
            exit 1
          fi
